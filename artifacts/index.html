<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#c2410c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<title>PALIAPP</title>
<style>
  :root{
    --bg:#f4f4f6;
    --surface:#ffffff;
    --ink:#1c1c1e;
    --muted:#3f3f46;
    --soft:#f4f4f6;
    --line:#e7e5e4;
    --preview:#3a3a3c;
    --accent:#c2410c;
    --accent-ink:#fff;
    --ring:rgba(196,92,56,.28);
    --shadow:0 1px 2px rgba(28,28,30,.04), 0 4px 6px -1px rgba(0,0,0,.05), 0 2px 4px -2px rgba(0,0,0,.03);
    --radius:16px;
    --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121212;
      --surface:#1c1c1e;
      --ink:#f5f5f7;
      --muted:#d4d4d8;
      --line:rgba(255,255,255,.08);
      --soft:#2c2c2e;
      --preview:#d1d1d6;
      --accent:#f0a07a;
      --accent-ink:#1c1c1e;
      --ring:rgba(240,160,122,.35);
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
  button,input,select,textarea{
    font:inherit;color:inherit;
    -webkit-appearance:none;appearance:none;
    transition:all .2s cubic-bezier(.4,0,.2,1);
  }
  button{cursor:pointer}
  header.app{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    display:flex;align-items:center;gap:12px;padding:12px 16px;
  }
  .logo{width:40px;height:40px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:14px;letter-spacing:-.03em;flex:0 0 auto}
  header h1{margin:0;font-size:1.2rem;font-weight:600;letter-spacing:-.03em;line-height:1.2}
  header p{margin:2px 0 0;color:var(--muted);font-size:.8125rem;font-weight:400}
  .grow{flex:1}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;
    padding:0 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;
    font-weight:600;font-size:.9375rem;white-space:nowrap;line-height:1.5;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.98)}
  .btn:focus-visible,.short:focus-visible,.mod:focus-visible,.scale-toggle:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline:none;box-shadow:0 0 0 3px var(--ring);
  }
  .btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:none}
  .wrap{max-width:1120px;margin:0 auto;padding:8px 16px 168px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
  h2{margin:0 0 8px;font-size:1.2rem;font-weight:600;letter-spacing:-.03em;line-height:1.25}
  h2.section-title{margin:18px 4px 10px}
  h3{margin:0 0 4px;font-size:1rem;font-weight:600}
  .kicker{font-size:.75rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .muted{color:var(--muted);font-weight:400}
  .meta-fields{display:flex;flex-direction:column;gap:2px}
  .meta-fields input,.meta-fields input[type=datetime-local]{width:100%;min-width:0}
  .desk-side .actions{display:flex;flex-direction:column;align-items:stretch}
  .desk-side .actions .btn{width:100%}
  .plate figcaption{display:none}
  .plate img{width:100%;height:200px;object-fit:cover;border-radius:16px;display:block}
  .shortcuts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .short{
    display:inline-flex;flex-direction:row;align-items:center;gap:8px;
    text-align:left;width:auto;min-height:44px;border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    background:var(--surface);color:var(--ink);box-shadow:none;
  }
  .short b{font-size:.9375rem;font-weight:600}
  .short span{display:none}
  .short:active{transform:scale(.98)}
  .mods{display:grid;grid-template-columns:1fr;gap:12px}
  .mod{
    display:flex;flex-direction:column;align-items:stretch;text-align:left;width:100%;
    padding:20px 20px 20px 22px;border:1px solid var(--line);border-radius:16px;
    background:var(--surface);box-shadow:var(--shadow);position:relative;cursor:pointer;
    font:inherit;color:inherit;
  }
  .mod:active{transform:scale(.995)}
  .mod .bar{position:absolute;left:10px;top:18px;bottom:18px;width:4px;border-radius:99px}
  .mod ul{margin:8px 0 0;padding:0 0 0 18px;color:var(--muted);font-size:.875rem;font-weight:400}
  .mod p{margin:0;font-weight:400}
  .chip{display:inline-flex;align-items:center;align-self:flex-start;height:26px;margin-top:10px;border-radius:99px;padding:0 10px;background:var(--soft);color:var(--ink);font-size:.75rem;font-weight:600}
  .chip.ready{background:var(--accent);color:var(--accent-ink)}
  .mod.done{box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 70%, transparent), var(--shadow)}
  .meter{height:6px;background:var(--soft);border-radius:99px;margin-top:14px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .scale{border:0;border-radius:16px;margin:10px 0;overflow:hidden;background:var(--soft)}
  .scale>header,.scale-toggle{
    padding:16px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;
    cursor:pointer;background:transparent;width:100%;border:0;font:inherit;color:inherit;text-align:left;min-height:56px;
  }
  .scale-toggle b,.scale>header b{font-weight:600;font-size:1rem}
  .scale .hint{display:block;font-size:.8125rem;font-weight:400;color:var(--muted)}
  .scale .body{padding:0 16px;max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.4,0,.2,1), padding .32s cubic-bezier(.4,0,.2,1)}
  .scale.open{background:var(--surface);box-shadow:var(--shadow)}
  .scale.open .body{display:block;max-height:4200px;padding:4px 16px 16px}
  footer.sticky{
    position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 78%, transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:22px;box-shadow:var(--shadow);
    display:flex;gap:8px;align-items:center;
    padding:8px 8px 8px 14px;z-index:30;
  }
  footer.sticky .preview{flex:1;min-width:0;font-size:.875rem;font-weight:400;color:var(--preview);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 0}
  footer.sticky.open{align-items:stretch;flex-wrap:wrap;padding:12px}
  footer.sticky.open .preview{white-space:pre-wrap;overflow:auto;max-height:34vh;flex-basis:100%;order:2}
  .dock-expand{min-height:48px;min-width:48px;box-shadow:none;background:transparent}
  .thumb{min-height:52px;min-width:112px;padding:0 18px;border-radius:16px;font-size:1rem}
  .toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40}
  .toast.on{opacity:1}
  .sec-copy{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .plate-frame{position:relative;min-height:180px;border-radius:16px;overflow:hidden;background:var(--soft)}
  .plate-fallback{display:none;min-height:180px;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--muted);background:var(--soft)}
  .plate-frame.failed img{display:none}
  .plate-frame.failed .plate-fallback{display:flex}
  .opt{
    display:flex;flex-direction:row;gap:12px;align-items:center;
    padding:14px 16px;border:0;border-radius:16px;margin:8px 0;min-height:48px;
    background:var(--soft);cursor:pointer;font-weight:400;box-shadow:none;align-items:flex-start;
  }
  .opt input{margin:3px 0 0;flex:0 0 auto}
  .opt:has(input:checked){background:color-mix(in srgb, var(--accent) 16%, var(--surface));box-shadow:var(--shadow)}
  .grid2{display:grid;grid-template-columns:1fr;gap:8px;align-items:center;margin:8px 0}
  .grid2>span{min-height:48px;display:flex;align-items:center;font-weight:400}
  .scorebox{background:color-mix(in srgb, var(--accent) 12%, var(--surface));border-radius:16px;padding:14px 16px;margin-top:12px;font-weight:600}
  .hidden{display:none !important}
  input,select,textarea{
    border:0;border-radius:14px;padding:12px 16px;background-color:var(--soft);width:100%;min-height:48px;
    box-shadow:none;line-height:1.5;
  }
  textarea{min-height:96px;resize:vertical;line-height:1.5;font-weight:400}
  select{
    padding-right:40px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none'><path d='M4 6l4 4 4-4' stroke='%23636366' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 16px center;background-size:16px 16px;
  }
  input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]):focus,
  select:focus,textarea:focus{outline:none;background-color:var(--surface);box-shadow:0 0 0 3px var(--ring)}
  input[type=checkbox],input[type=radio]{
    width:22px;height:22px;min-height:22px;padding:0;margin:2px 0 0;flex:0 0 auto;
    border:1.5px solid #d1d1d6;border-radius:7px;background:#fff;box-shadow:none;accent-color:auto;
  }
  input[type=radio]{border-radius:50%}
  input[type=checkbox]:checked{
    background-color:var(--accent);border-color:var(--accent);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.2 8.2l3 3.1 6.2-6.4' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:center;background-size:14px 14px;
  }
  input[type=radio]:checked{
    border-color:var(--accent);background-color:#fff;
    background-image:radial-gradient(circle, var(--accent) 0 5px, transparent 5.5px);
  }
  input[type=checkbox]:focus-visible,input[type=radio]:focus-visible{box-shadow:0 0 0 3px var(--ring)}
  input[type=range]{
    width:100%;height:44px;min-height:44px;padding:0;margin:0;border:0;border-radius:0;
    background:transparent;box-shadow:none;touch-action:pan-y;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:99px;
    background:linear-gradient(90deg,var(--accent) var(--p,0%), #e4e4e7 var(--p,0%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-12px;border:0;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(28,28,30,.08), 0 6px 16px rgba(28,28,30,.16);
  }
  input[type=range]::-moz-range-track{height:4px;border:0;border-radius:99px;background:#e4e4e7}
  input[type=range]::-moz-range-progress{height:4px;border-radius:99px;background:var(--accent)}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(28,28,30,.08), 0 6px 16px rgba(28,28,30,.16)}
  .esas-name{
    order:2;font-weight:600;font-size:.8125rem;line-height:1.2;text-align:center;
    color:#6b2e12;background:linear-gradient(180deg,#f8d7c4,#e7b08a);
    border-radius:12px;padding:8px 10px;min-width:6.6rem;max-width:8.2rem;
    box-shadow:0 2px 6px rgba(194,65,12,.2);
  }
  input[type=file]{-webkit-appearance:auto;appearance:auto;background:transparent;box-shadow:none;padding:0;line-height:1.5}
  label{display:flex;flex-direction:column;gap:6px;margin:12px 0;font-size:.875rem;font-weight:600;color:var(--ink);line-height:1.5}
  label.opt{font-weight:400;font-size:1rem;margin:8px 0}
  .esas{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;margin:14px 0}
  .esas input[type=range]{order:1}
  .esas b{order:3;min-width:1.4rem;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .src{font-size:.8125rem;font-weight:400;color:var(--muted);background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px}
  .warnbox{background:color-mix(in srgb, #f3ddb0 70%, var(--surface));color:#6b4e16;border-radius:16px;padding:14px 16px;margin:8px 0;font-size:.9375rem;font-weight:400}
  .okbox{background:color-mix(in srgb, #cfe6d4 70%, var(--surface));color:#245c32;border-radius:16px;padding:14px 16px;margin:8px 0;font-weight:400}
  .badbox{background:color-mix(in srgb, #f3cfc9 70%, var(--surface));color:#7a2433;border-radius:16px;padding:14px 16px;margin:8px 0;font-weight:400}
  pre.report{white-space:pre-wrap;background:var(--soft);border:0;border-radius:16px;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875rem;line-height:1.55}
  .empty{border:0;border-radius:16px;padding:22px;background:var(--soft);color:var(--muted);font-weight:400}
  .navback{margin-bottom:12px}
  details{margin:8px 0}
  details summary{cursor:pointer;color:var(--accent);font-weight:600;transition:color .2s cubic-bezier(.4,0,.2,1)}
  @media (max-width:719px){
    header.app{flex-wrap:wrap}
    header.app .grow{display:none}
    header.app .actions{width:100%}
    header.app .actions .btn{flex:1 1 0;padding:0 8px;font-size:.8125rem;box-shadow:none;background:var(--surface)}
    header.app .actions .btn-primary{background:var(--accent)}
  }
  @media (min-width:720px){
    .mods{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:minmax(0,1fr) minmax(160px,240px)}
  }
  @media (min-width:980px){
    .desk{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
    .desk-side{position:sticky;top:76px}
    .desk-side .plate img{height:220px}
    .section-title{margin-top:0}
    footer.sticky{
      left:auto;right:24px;bottom:24px;width:340px;
      flex-direction:column;align-items:stretch;padding:12px;
      border:1px solid var(--line);
    }
    footer.sticky .preview{white-space:normal;overflow:auto;max-height:7.5em}
    footer.sticky .thumb{width:100%}
    .toast{left:auto;right:36px;transform:none}
  }
  @media (prefers-color-scheme: dark){
    .warnbox{color:#f6e2b3}
    .okbox{color:#c8ecd2}
    .badbox{color:#f6c9c9}
    .short{background:var(--surface)}
    .esas-name{color:#f8d7c4;background:linear-gradient(180deg,#6b3a28,#4a2418);box-shadow:none}
    .card,.mod,.short,.scale.open,footer.sticky,.btn:not(.btn-primary):not(.dock-expand){border:1px solid rgba(255,255,255,.08);box-shadow:none}
    select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16' fill='none'><path d='M4 6l4 4 4-4' stroke='%23aeaeb2' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
    input[type=checkbox],input[type=radio]{background:#2c2c2e;border-color:#48484a}
    input[type=checkbox]:checked{
      background-color:var(--accent);border-color:var(--accent);
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3.2 8.2l3 3.1 6.2-6.4' fill='none' stroke='%231c1c1e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    }
    input[type=radio]:checked{background-color:#2c2c2e;border-color:var(--accent)}
    input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--accent) var(--p,0%), #3a3a3c var(--p,0%))}
    input[type=range]::-moz-range-track{background:#3a3a3c}
    input[type=range]::-moz-range-progress{background:var(--accent)}
    input[type=range]::-webkit-slider-thumb,input[type=range]::-moz-range-thumb{box-shadow:0 2px 10px rgba(0,0,0,.45)}
  }
</style>
</head>
<body>
<header class="app">
  <div class="logo">Pa</div>
  <div>
    <h1>PALIAPP</h1>
    <p>Consulta en vivo · texto listo para pegar en la historia clínica</p>
  </div>
  <div class="grow"></div>
  <div class="actions">
  <button class="btn" onclick="show('sources')">Fuentes</button>
  <button class="btn" onclick="clearAll()">Limpiar visita</button>
  <button class="btn btn-primary" onclick="showReport()">Texto para HC</button>
  </div>
</header>
<div class="wrap" id="view-home">
  <div class="desk">
    <div class="desk-side">
      <div class="card" id="meta-card"></div>
      <div class="card">
        <figure class="plate">
          <div class="plate-frame" id="plate-frame">
            <img id="plate-img" src="laminas/bandeja.jpg" alt="Viñeta de la situación, cambia con la función" onerror="plateFail()">
            <div class="plate-fallback" aria-hidden="true">
              <svg width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect x="4" y="6" width="28" height="22" rx="3" stroke="#b86b62" stroke-width="1.6"/><path d="M8 22l6-6 4 4 3-3 7 7" stroke="#8eabc4" stroke-width="1.6" stroke-linejoin="round"/><circle cx="13" cy="13" r="2" fill="#e7b7b0"/></svg>
              <span>Lámina no disponible</span>
            </div>
          </div>
          <figcaption><p id="plate-cap" class="muted" style="margin:0"></p></figcaption>
        </figure>
      </div>
      <div class="card">
        <h2>Evaluación según tipo de visita</h2>
        <p class="muted" style="margin:0 0 8px">Un atajo abre solo lo que suele hacer falta.</p>
        <div class="shortcuts">
          <button class="short" onclick="openVisit('primera')"><b>Primera vez</b><span>NECPAL, PPS, Barthel, ESAS, fase</span></button>
          <button class="short" onclick="openVisit('control')"><b>Control</b><span>ESAS, fase y lo que cambió</span></button>
          <button class="short" onclick="openVisit('delirium')"><b>Delirium</b><span>RASS, CAM y MDAS si positivo</span></button>
          <button class="short" onclick="openVisit('techo')"><b>Techo terapéutico</b><span>PPS, PaP o PPI, planificación</span></button>
        </div>
      </div>
    </div>
    <div class="desk-main">
      <h2 class="section-title">Escalas agrupadas por categorías</h2>
      <div class="mods" id="modgrid"></div>
      <div class="card" id="saved-card"></div>
    </div>
  </div>
</div>
<div class="wrap hidden" id="view-mod"></div>
<div class="wrap hidden" id="view-report"></div>
<div class="wrap hidden" id="view-sources"></div>
<footer class="sticky" id="dock">
  <button type="button" class="btn dock-expand" id="dock-btn" aria-expanded="false" onclick="toggleDock()">Ver</button>
  <div class="preview" id="live">Todavía no hay texto. Completá una escala.</div>
  <button class="btn btn-primary thumb" onclick="copyReport()">Copiar</button>
</footer>
<div class="toast" id="toast">Copiado</div>
<script>
const VISITS = {
  primera: ['necpal','pps','barthel','esas','fase'],
  control: ['esas','fase'],
  delirium: ['rass','cam','mdas'],
  techo: ['pps','pap','ppi','plan']
};
const MODS = [
  {id:'need', title:'Necesidades', color:'#c9847a', tools:['necpal','spict','hexcom'], blurb:'¿Hace falta un enfoque paliativo, y qué tan complejo es?'},
  {id:'func', title:'Funcionalidad', color:'#8eabc4', tools:['pps','ecog','kps','barthel','lawton','katz'], blurb:'PPS se reutiliza en el PPI. Karnofsky, en el PaP.'},
  {id:'prog', title:'Pronóstico y fase', color:'#d2a36a', tools:['fase','ppi','pap'], blurb:'Fase de enfermedad, PPI y PaP. Sin laboratorios no hay PaP.'},
  {id:'sym', title:'Síntomas de hoy', color:'#c47d8a', tools:['esas','dolor','rass'], blurb:'Lo que se mira en cada visita, no solo en la primera.'},
  {id:'cog', title:'Cognición', color:'#b7a4c8', tools:['cam','mdas','mmse','gds'], blurb:'CAM para cribado. MDAS si hay delirium. GDS si hay demencia.'},
  {id:'care', title:'Cuidador', color:'#c49a7c', tools:['zarit'], blurb:'Carga. En domicilio cambia la conducta más que otra escala.'},
  {id:'plan', title:'Planificación', color:'#8eabc4', tools:['plan'], blurb:'Representante, lugar de muerte, reanimación. Párrafo para pegar.'},
  {id:'opio', title:'Opioides', color:'#d2a36a', tools:['opio'], blurb:'Abre la calculadora de opioides.'},
  {id:'dep', title:'Desprescripción', color:'#b7a4c8', tools:['dep'], blurb:'Apartado reservado. Todavía sin instrumento.'}
];
const NAMES = {

function loadMeta(){ try { return JSON.parse(localStorage.getItem('cpdesk-meta')||'{}'); } catch(e){ return {}; } }

function saveSaved(list){ localStorage.setItem('cpdesk-visitas', JSON.stringify(list)); }
function sectionText(ids){
  const parts = ids.map(id=> state[id] ? interpret(id, state[id]) : '').filter(Boolean);
  const meta = loadMeta();
  if(ids[0]==='necpal' && meta.includeWhen && meta.when) parts.unshift('Visita: '+meta.when.replace('T',' ')+'.');
  return parts.join(' ');
}
function warnings(){
  const w = [];
  const pap = state.pap;
  if(pap && (!state.kps && !pap.kps || !pap.wbc || !pap.lin)) w.push('PaP sin Karnofsky o sin laboratorios: no calcula hasta que estén.');
  if(state.cam && state.cam.c0 && state.cam.c1 && (state.cam.c2 || state.cam.c3) && !state.mdas) w.push('CAM positivo. Si podés, completá el MDAS.');
  if(state.ppi && !state.pps && !state.ppi.pps) w.push('PPI sin PPS. Cargalo en Funcionalidad o en la misma escala.');
  return w;
}
function renderWarnings(){
  let box = document.getElementById('warn-card');
  if(!box){
    box = document.createElement('div');
    box.id = 'warn-card';
    $('modgrid')?.before(box);
  }
  const w = warnings();
  box.innerHTML = w.length ? w.map(t=>`<div class="warnbox">${esc(t)}</div>`).join('') : '';
}
function renderMeta(){
  const m = loadMeta();
  const when = m.when || new Date().toISOString().slice(0,16);
  $('meta-card').innerHTML = `<p class="kicker">Esta visita</p>
    <div class="meta-fields">
      <label>Fecha y hora<input id="meta-when" type="datetime-local" value="${esc(when)}"></label>
      <label>Identificador local<input id="meta-id" placeholder="cama, iniciales, no va al texto" value="${esc(m.localId||'')}"></label>
    </div>
    <label class="opt"><input id="meta-inc" type="checkbox" ${m.includeWhen?'checked':''}> Incluir fecha y hora en el texto</label>
    <div class="actions">
      <button type="button" class="btn" onclick="guardarVisita()">Guardar visita</button>
      <button type="button" class="btn" onclick="exportar()">Exportar JSON</button>
      <button type="button" class="btn" onclick="$('import-file').click()">Importar JSON</button>
      <input id="import-file" type="file" accept="application/json" class="hidden" onchange="importar(this)">
    </div>`;
  $('meta-card').querySelectorAll('input').forEach(n=>n.addEventListener('change', persistMeta));

function persistMeta(){
  saveMeta({
    when: $('meta-when')?.value || '',
    localId: $('meta-id')?.value || '',
    includeWhen: !!$('meta-inc')?.checked
  });
}
function guardarVisita(){
  persistMeta();
  const meta = loadMeta();
  const list = loadSaved();
  list.unshift({ id: Date.now(), when: meta.when, localId: meta.localId, data: JSON.parse(JSON.stringify(state)) });
  saveSaved(list.slice(0,30));
  toast('Visita guardada');
  renderSaved();
}
function renderSaved(){
  const list = loadSaved();
  $('saved-card').innerHTML = `<p class="kicker">Visitas en este celular</p>
    ${list.length? list.map(v=>`<div class="sec-copy"><span>${esc(v.localId||'Sin identificador')} · ${esc((v.when||'').replace('T',' '))}</span>
      <span class="actions"><button type="button" class="btn" onclick="reabrir(${v.id})">Reabrir</button>
      <button type="button" class="btn" onclick="duplicar(${v.id})">Duplicar</button></span></div>`).join('') : '<p class="muted">Todavía no hay visitas guardadas.</p>'}`;
}
function reabrir(id){
  const v = loadSaved().find(x=>x.id===id);
  if(!v) return;
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, v.data||{});
  persist();
  show('home');
  toast('Visita reabierta');
}
function duplicar(id){
  const v = loadSaved().find(x=>x.id===id);
  if(!v) return;
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, v.data||{});
  persist();
  show('home');
  toast('Copia lista para el control');
}
function exportar(){
  persistMeta();
  const blob = new Blob([JSON.stringify({ version:1, state, meta: loadMeta(), visitas: loadSaved() }, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'paliapp-visitas.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importar(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const data = JSON.parse(reader.result);
      if(!data || !data.state) throw new Error('sin state');
      if(!confirm('Esto reemplaza la visita abierta y la lista guardada de este celular.')) return;
      Object.keys(state).forEach(k=>delete state[k]);
      Object.assign(state, data.state);
      persist();
      if(data.meta) saveMeta(data.meta);
      if(Array.isArray(data.visitas)) saveSaved(data.visitas);
      show('home');
      toast('Importado');
    } catch(e){ toast('Ese JSON no sirve'); }
  };
  reader.readAsText(file);
  input.value = '';
}
function renderHome(){
  $('modgrid').innerHTML = MODS.map(m=>{
    const tools = m.tools.filter(t=>t!=='dep');
    const done = tools.filter(t=>state[t]).length;
    const full = tools.length && done===tools.length;
    if(m.id==='opio'){
      return `<button type="button" class="mod" onclick="location.href='https://leandroantonielli.github.io/CalculadoraOpioides/'">
      <div class="bar" style="background:${m.color}"></div>
      <h3>${m.title}</h3>
      <p class="muted" style="margin:0">${m.blurb}</p>
      <ul><li>Calculadora de opioides</li></ul>
      <span class="chip">abrir</span>
    </button>`;
    }
    return `<button type="button" class="mod${full?' done':''}" onclick="openMod('${m.id}')">
      <div class="bar" style="background:${m.color}"></div>
      <h3>${m.title}</h3>
      <p class="muted" style="margin:0">${m.blurb}</p>
      <ul>${m.tools.map(t=>`<li>${NAMES[t]}</li>`).join('')}</ul>
      <div class="meter" aria-hidden="true"><i style="width:${tools.length? Math.round(done/tools.length*100):0}%"></i></div>
      <span class="chip">${full?'completa': done+'/'+tools.length}</span>
    </button>`;
  }).join('');
  renderMeta();
  renderSaved();
  renderWarnings();
}
function openVisit(kind){ state.visit = kind; persist(); openMod(null, VISITS[kind]); }
function openMod(modId, only){
  const tools = only || MODS.find(m=>m.id===modId).tools;
  const title = only ? ({primera:'Primera vez',control:'Control',delirium:'Delirium',techo:'Techo terapéutico'}[state.visit]) : MODS.find(m=>m.id===modId).title;
  show('mod');
  $('view-mod').innerHTML = `<button class="btn navback" onclick="show('home')">← PALIAPP</button>
    <div class="card"><h2>${title}</h2><p class="muted" style="margin:0">Solo entra al texto lo que completes. ${only?'Atajo de visita.':''}</p></div>
    ${tools.map(t=>toolCard(t)).join('')}`;
  tools.forEach(bind);
  tools.forEach(t=>{
    if(!only) return;
    const sec = document.getElementById('sc-'+t);
    sec?.classList.add('open');
    sec?.querySelector('.scale-toggle')?.setAttribute('aria-expanded','true');
    const chip = sec?.querySelector('.chip');
    if(chip && chip.textContent==='abrir') chip.textContent = 'cerrar';
  });
}
function toggleScale(btn){
  const sec = btn.closest('.scale');
  const open = sec.classList.toggle('open');
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  const chip = btn.querySelector('.chip');
  if(chip && chip.textContent!=='listo') chip.textContent = open ? 'cerrar' : 'abrir';
}
function toolCard(id){
  return `<section class="scale" id="sc-${id}"><h3 class="scale-h"><button type="button" class="scale-toggle" aria-expanded="false" aria-controls="bd-${id}" onclick="toggleScale(this)"><span><b>${NAMES[id]}</b><span class="muted hint">${hint(id)}</span></span><span class="chip${state[id]&&interpret(id,state[id])?' ready':''}" id="st-${id}">${state[id]&&interpret(id,state[id])?'listo':'abrir'}</span></button></h3><div class="body" id="bd-${id}"></div></section>`;

function bind(id){
  const el = $('bd-'+id);
  el.innerHTML = forms[id]();
  restore(id);
  el.querySelectorAll('input,select,textarea').forEach(n=>n.addEventListener('input', ()=>{
    if(id==='dolor' && n.dataset.k==='nrs') n.dataset.touched = '1';
    collect(id);
  }));
  if(id==='dolor') prefillDolor(el);
  collect(id, true);
}
function prefillDolor(el){
  const pain = num(state.esas && state.esas.Dolor);
  const n = el.querySelector('[data-k=nrs]');
  if(!n || pain==null || n.dataset.touched==='1') return;
  const own = state.dolor && state.dolor.nrs;
  if(own==null || own==='' || own==='0') n.value = String(pain);
}

function ppsTxt(n){ return ({100:'plena actividad',90:'actividad normal con algún síntoma',80:'actividad con esfuerzo',70:'no puede trabajar, se autocuida',60:'necesita ayuda ocasional',50:'necesita ayuda considerable',40:'más en cama, ayuda mayor',30:'encamado, cuidado total',20:'moribundo, mínimo oral',10:'moribundo'})[n]||''; }
function kpsTxt(n){ return ({100:'normal',90:'actividad normal, síntomas leves',80:'actividad con esfuerzo',70:'se autocuida, no trabaja',60:'ayuda ocasional',50:'ayuda importante',40:'incapaz, ayuda especial',30:'encamado, soporte',20:'muy grave',10:'moribundo',0:'muerto'})[n]||''; }
function barthelItems(){ return [['alim','Alimentación',[['10','Independiente'],['5','Ayuda'],['0','Dependiente']]],['ban','Baño',[['5','Independiente'],['0','Dependiente']]],['ves','Vestido',[['10','Independiente'],['5','Ayuda'],['0','Dependiente']]],['ase','Aseo',[['5','Independiente'],['0','Dependiente']]],['dep','Deposición',[['10','Continente'],['5','Occasional'],['0','Incontinente']]],['mic','Micción',[['10','Continente'],['5','Occasional'],['0','Incontinente']]],['ret','Retrete',[['10','Independiente'],['5','Ayuda'],['0','Dependiente']]],['tra','Traslado',[['15','Independiente'],['10','Mínima ayuda'],['5','Gran ayuda'],['0','Dependiente']]],['dea','Deambulación',[['15','Independiente'],['10','Ayuda'],['5','Silla de ruedas'],['0','Dependiente']]],['esc','Escaleras',[['10','Independiente'],['5','Ayuda'],['0','Dependiente']]]]; }
function restore(id){
  const d = state[id] || {};
  const root = $('bd-'+id);
  root.querySelectorAll('[data-k]').forEach(n=>{
    const v = d[n.dataset.k];
    if(v==null) return;
    if(n.type==='checkbox') n.checked = !!v;
    else n.value = v;
  });
  root.querySelectorAll('input[type=radio]').forEach(n=>{ if(String(d[n.name])===n.value) n.checked = true; });

function collect(id, silent){
  if(id==='dep') return;
  const root = $('bd-'+id);
  if(!root) return;
  const d = {};
  root.querySelectorAll('[data-k]').forEach(n=>{ d[n.dataset.k] = n.type==='checkbox' ? n.checked : n.value; });
  root.querySelectorAll('input[type=radio]:checked').forEach(n=>{ d[n.name] = n.value; });
  const empty = !Object.values(d).some(v=>v && v!=='0' && v!==false);
  if(!silent){ state[id] = empty ? undefined : d; if(empty) delete state[id]; persist(); }

  if(!root.querySelector('.scorebox')){ box.className='scorebox'; root.appendChild(box); }
  const txt = interpret(id, d);
  box.innerHTML = txt ? `<b>${txt}</b>` : '<span class="muted">Sin resultado todavía.</span>';
  const st = $('st-'+id);
  if(st){
    const open = root.closest('.scale')?.classList.contains('open');
    st.textContent = txt ? 'listo' : (open ? 'cerrar' : 'abrir');
    st.classList.toggle('ready', !!txt);
  }
  root.querySelectorAll('input[type=range]').forEach(n=>{ const b=n.nextElementSibling; if(b&&b.tagName==='B') b.textContent=n.value; n.style.setProperty('--p', ((Number(n.value)||0)/10*100)+'%'); });
  if(id==='esas'){
    const dolor = $('bd-dolor');
    const slider = dolor && dolor.querySelector('[data-k=nrs]');
    if(slider && slider.dataset.touched!=='1'){
      slider.value = d.Dolor || '0';
      collect('dolor', true);
    }

function num(v){ const n = parseFloat(String(v??'').replace(',','.')); return Number.isFinite(n)?n:null; }
function interpret(id, d){
  if(id==='necpal'){
    if(!d.sq && !d.demanda) return '';
    const nombres = {p1:'declive funcional',p2:'declive nutricional',p3:'síntomas persistentes',p4:'multimorbilidad',p5:'uso intensivo de recursos'};
    const on = Object.keys(nombres).filter(k=>d[k]).map(k=>nombres[k]);
    const grupos = [];
    if(['ep1','ep2','ep3','ep4','ep5'].some(k=>d[k])) grupos.push('EPOC');
    if(['ic1','ic2','ic3','ic4','ic5'].some(k=>d[k])) grupos.push('insuficiencia cardíaca');
    if(['de1','de2','de3','de4','de5','de6'].some(k=>d[k])) grupos.push('demencia');
    if(['re1','re2','re3','re4','re5','re6'].some(k=>d[k])) grupos.push('enfermedad renal');
    if(['he1','he2','he3','he4','he5','he6'].some(k=>d[k])) grupos.push('cirrosis');
    if(d.onco) grupos.push('oncología');
    if(grupos.length) on.push('indicadores específicos ('+grupos.join(', ')+')');

    if(!d.sq) return 'NECPAL 4.0: hay demanda expresada. Falta la pregunta sorpresa.';
    if(!on.length) return 'NECPAL 4.0: pregunta sorpresa positiva, sin parámetros generales.'+demanda;

    const s = Object.keys(d).filter(k=>k.startsWith('s')&&d[k]).length;
    if(!g&&!s) return '';

  }
  if(id==='hexcom'){
    const vals = Object.entries(d).filter(([,v])=>v);
    if(!vals.length) return '';
    const rank = {Baja:1,Media:2,Alta:3};
    const areas = {};
    vals.forEach(([k,v])=>{ const a=k.split('-')[0]; if(!areas[a]||rank[v]>rank[areas[a]]) areas[a]=v; });
    const global = Object.values(areas).sort((a,b)=>rank[b]-rank[a])[0];
    const altas = vals.filter(([,v])=>v==='Alta').map(([k])=>k.split('-')[1]);
    return `HexCom-Clin: complejidad ${global.toLowerCase()}.${altas.length?' Alta en '+altas.join(', ')+'.':''}`;
  }
  if(id==='pps') return d.pps?`PPS ${d.pps}%. ${ppsTxt(d.pps)}.`:'';
  if(id==='ecog') return d.ecog!=null && d.ecog!==''?`ECOG ${d.ecog}.`:'';
  if(id==='kps') return d.kps?`Karnofsky ${d.kps}%.`:'';
  if(id==='barthel'){
    const keys = barthelItems().map(x=>x[0]);

    const t = keys.reduce((a,k)=>a+Number(d[k]),0);
    const band = t<20?'dependencia total':t<=60?'dependencia severa':t<=90?'dependencia moderada':t<=99?'dependencia leve':'independencia';

  if(id==='katz'){ const n=Object.values(d).filter(Boolean).length; const lost=6-n; return n?`Katz: independiente en ${n}/6${lost?`, dependencia en ${lost}`:''}.`:''; }
  if(id==='fase') return d.fase?`Fase ${d.fase}.`:'';
  if(id==='ppi'){

    return `PPI ${s}: ${g}.`;
  }
  if(id==='pap'){

  }
  if(id==='esas'){
    const hits = Object.entries(d).filter(([k,v])=>k!=='otrotxt' && num(v)>=4);
    if(!hits.length && !Object.values(d).some(v=>num(v)>0)) return '';
    const top = Object.entries(d).filter(([k])=>k!=='otrotxt').sort((a,b)=>num(b[1])-num(a[1])).filter(([,v])=>num(v)>0).slice(0,4);

  }
  if(id==='dolor'){
    const n = Object.keys(d).filter(k=>k!=='nrs'&&d[k]).length;
    const esasN = state.esas ? num(state.esas.Dolor) : null;
    const nrs = (d.nrs!=null && d.nrs!=='') ? String(d.nrs) : (esasN!=null ? String(esasN) : '0');
    if((nrs==='0') && !n) return '';
    const same = esasN!=null && String(esasN)===nrs;
    if(same && !n) return '';
    if(same) return `Entrevista neuropática ${n}/7${n>=3?', sugiere componente neuropático':''}. Intensidad ${nrs}/10, tomada del ESAS.`;
    return `Dolor ${nrs}/10${n?`. Entrevista neuropática ${n}/7${n>=3?', sugiere componente neuropático':''}`:''}.`;
  }
  if(id==='rass') return d.rass!=null && d.rass!==''?`RASS ${d.rass}.`:'';
  if(id==='cam'){
    const c = [0,1,2,3].map(i=>!!d['c'+i]);
    if(!c.some(Boolean)) return '';
    return (c[0]&&c[1]&&(c[2]||c[3]))?'CAM positivo: cumple criterios de delirium.':'CAM negativo: no cumple el algoritmo de delirium.';
  }
  if(id==='mdas'){
    const vals = Object.values(d).map(num);
    if(vals.some(v=>v==null)) return '';
    const t = vals.reduce((a,b)=>a+b,0);
    return `MDAS ${t}/30: ${t>=7?'alcanza el corte de delirium':'por debajo del corte de delirium'}.`;
  }
  if(id==='mmse'){
    const spec = [['Orientación',10],['Registro',3],['Atención',5],['Recuerdo',3],['Lenguaje y praxia',9]];
    if(spec.some(([k])=>d[k]===''||d[k]==null)) return '';
    if(spec.some(([k,m])=>num(d[k])==null || num(d[k])>m)) return 'Mini-Mental: revisá un dominio fuera de rango.';
    const t = spec.reduce((a,[k])=>a+num(d[k]),0);
    const v = t<=9?'deterioro grave':t<=18?'deterioro moderado':t<=23?'deterioro leve':'sin deterioro por corte habitual';
    return `Mini-Mental ${t}/30: ${v}${d.esc?`, escolaridad ${d.esc} años`:''}.`;
  }
  if(id==='gds') return d.gds?`GDS ${d.gds}.`:'';
  if(id==='zarit'){
    const vals = Object.values(d).map(num);
    if(vals.some(v=>v==null) || !vals.length) return '';
    const t = vals.reduce((a,b)=>a+b,0);
    return `Zarit breve ${t}/48: ${t>=17?'carga alta':'carga no alta por este corte'}.`;
  }
  if(id==='plan'){
    const bits = [];
    if(d.rep) bits.push(`representante ${d.rep}`);
    if(d.lugar) bits.push(`lugar deseado de muerte: ${d.lugar}`);
    if(d.rcp) bits.push(`reanimación: ${d.rcp}`);
    if(d.hab) bits.push(`se habló: ${d.hab}`);
    if(d.nohab) bits.push(`no se habló: ${d.nohab}`);
    return bits.length?`Planificación: ${bits.join('. ')}.`:'';
  }
  if(id==='opio'){
    const dose = num(d.dose);
    if(!dose) return '';
    const demo = toDemo(d.from, dose);

function toDemo(drug, dose){
  if(drug==='Morfina VO') return dose;

  if(drug==='Fentanilo EV mcg/día') return dose/10;

}
function fromDemo(drug, demo){
  if(drug==='Morfina VO') return `${Math.round(demo)} mg/día VO`;
  if(drug==='Morfina SC') return `${Math.round(demo/2)} mg/día SC`;
  if(drug==='Morfina EV') return `${Math.round(demo/2.5)} mg/día EV`;
  if(drug==='Oxicodona VO') return `${Math.round(demo/1.5)} mg/día VO`;
  if(drug==='Tramadol VO') return `${Math.round(demo*10)} mg/día VO`;
  if(drug==='Codeína VO') return `${Math.round(demo*10)} mg/día VO`;
  if(drug==='Fentanilo EV mcg/día') return `${Math.round(demo*10)} mcg/día EV`;
  if(drug==='Fentanilo TD mcg/h'){
    const h = demo/2.4;
    const patches = [12,25,50,75,100];
    const near = patches.reduce((a,b)=>Math.abs(b-h)<Math.abs(a-h)?b:a);
    return `cerca de ${near} mcg/h (estimación ${h.toFixed(0)} mcg/h; confirmar en la calculadora)`;
  }
  return '—';
}
function reportLines(){
  const order = ['necpal','spict','hexcom','pps','ecog','kps','barthel','lawton','katz','fase','ppi','pap','esas','dolor','rass','cam','mdas','mmse','gds','zarit','plan','opio'];
  return order.map(id=>{
    if(!state[id]) return '';

  }).filter(Boolean);
}
function reportText(){
  const lines = reportLines();

  frame?.classList.remove('failed');
  const pps = num(state.pps?.pps);
  const fase = state.fase?.fase;
  if(fase==='terminal' || (pps!=null && pps<=30)){
    img.src='laminas/cama.jpg';
    cap.textContent='Reposo casi completo. Ilustración de la situación, no un retrato ni un pronóstico dibujado.';
  } else if((pps!=null && pps<=60) || fase==='deterioro' || fase==='inestable'){
    img.src='laminas/pasillo.jpg';
    cap.textContent='Se mueve con ayuda. La lámina sigue a la función, no a la cara de nadie.';
  } else if((pps!=null && pps>=70) || fase==='estable'){
    img.src='laminas/silla.jpg';
    cap.textContent='Más tiempo en la silla que en la cama. Sigue siendo una viñeta de manual.';
  } else {
    img.src='laminas/bandeja.jpg';
    cap.textContent='No es el paciente. Es una viñeta de manual, y cambia con el PPS o la fase. Mientras no haya datos, queda la bandeja.';
  }
}
function showReport(){
  show('report');
  const blocks = SECTIONS.map(s=>{
    const text = sectionText(s.ids);
    if(!text) return '';
    return `<div class="card"><div class="sec-copy"><h2>${s.title}</h2><button type="button" class="btn" onclick="copySection('${s.id}')">Copiar sección</button></div>
      <textarea id="sec-${s.id}" rows="4">${esc(text)}</textarea></div>`;
  }).join('');
  const notes = warnings().map(w=>`<div class="warnbox">${esc(w)}</div>`).join('');
  $('view-report').innerHTML = `<button class="btn navback" onclick="show('home')">← PALIAPP</button>
    <div class="card"><h2>Texto para la historia clínica</h2>
    <p class="muted">Se puede editar antes de copiar. El identificador local no entra. La fecha solo si la marcaste.</p>
    ${notes}
    <button class="btn btn-primary" onclick="copyReport()">Copiar todo</button></div>
    ${blocks || '<div class="card">Nada completado todavía.</div>'}`;
}
function copySection(id){
  const el = document.getElementById('sec-'+id);
  copyText(el ? el.value.trim() : '');
}
function copyReport(){
  const areas = [...document.querySelectorAll('[id^=sec-]')];
  const t = areas.length ? areas.map(a=>a.value.trim()).filter(Boolean).join('\n\n') : reportText();
  copyText(t);
}
function copyText(t){
  if(!t){ $('live').textContent = 'Nada para copiar.'; return; }
  const done = ()=>toast('Copiado');
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(done, ()=>{ fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove();
}
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('on'), 1400);
}
function toggleDock(){
  const dock = $('dock');
  const open = dock.classList.toggle('open');
  $('dock-btn').setAttribute('aria-expanded', open?'true':'false');
  $('dock-btn').textContent = open ? 'Ocultar' : 'Ver';
}
function clearAll(){ if(!confirm('¿Borrar la visita de este navegador?')) return; localStorage.removeItem('cpdesk'); Object.keys(state).forEach(k=>delete state[k]); paintLive(); show('home'); }
function renderSources(){
  $('view-sources').innerHTML = `<button class="btn navback" onclick="show('home')">← PALIAPP</button>
    <div class="card"><h2>De dónde sale cada cosa</h2>
    <ul>
      <li>NECPAL 4.0, SPICT, HexCom-Clin, Barthel, ECOG, Karnofsky, CAM, GDS y MDAS: material INC/MSAL, módulo 1, más la fuente primaria citada en cada escala.</li>
      <li>PPI: Morita 1999. PaP: Maltoni y Pirovano 1999.</li>
      <li>PPS: Victoria Hospice. Descriptores resumidos.</li>
      <li>ESAS-r: Edmonton Symptom Assessment System.</li>
      <li>DN4 entrevista: Bouhassira 2005. Ítems de cribado, no el formulario completo.</li>
      <li>RASS: Sessler 2002. Fase: Eagar y cols.</li>
      <li>Mini-Mental: Folstein 1975. Estructura de 30 puntos; el formulario oficial está licenciado.</li>
      <li>Lawton 1969 y Katz 1963: no están en el PDF del módulo 1.</li>
      <li>Zarit breve: Bédard 2001. Ítems parafraseados.</li>
      <li>Opioides: factores de la calculadora de Antonielli. Esta pantalla es una estimación.</li>
    </ul>
    <div class="warnbox">Mockup de consulta. No guarda pacientes en un servidor. Lo que queda, queda en este navegador.</div></div>`;
}
renderHome();
paintLive();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
